<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Explication du simulateur de devis EBM</title>
  <desc id="desc">Infographie en français expliquant simplement et sérieusement le fonctionnement du simulateur EBM.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff7fb"/>
      <stop offset="48%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#eefdf8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#f9739b"/>
      <stop offset="52%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0f9f83"/>
    </linearGradient>
    <filter id="shadow" x="-16%" y="-16%" width="132%" height="142%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#2f2442" flood-opacity="0.14"/>
    </filter>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 56px; font-weight: 800; fill: #211d31; }
      .subtitle { font-size: 27px; font-weight: 600; fill: #635d72; }
      .kicker { font-size: 20px; font-weight: 800; letter-spacing: 1.8px; fill: #7c3aed; }
      .section { font-size: 31px; font-weight: 800; fill: #252033; }
      .body { font-size: 24px; font-weight: 600; fill: #514a62; }
      .small { font-size: 20px; font-weight: 600; fill: #6b6477; }
      .chip { font-size: 20px; font-weight: 800; fill: #ffffff; }
      .white-title { font-size: 31px; font-weight: 900; fill: #ffffff; }
      .white-small { font-size: 20px; font-weight: 700; fill: rgba(255,255,255,0.9); }
      .formula { font-size: 29px; font-weight: 850; fill: #272236; }
      .muted { font-size: 18px; font-weight: 700; fill: #7a7185; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg)"/>
  <circle cx="118" cy="126" r="82" fill="#ffd4e6" opacity="0.75"/>
  <circle cx="1490" cy="150" r="112" fill="#bdf8e6" opacity="0.78"/>
  <circle cx="1375" cy="1038" r="144" fill="#ddd6fe" opacity="0.62"/>
  <circle cx="190" cy="1060" r="112" fill="#fde7a8" opacity="0.62"/>

  <g class="font">
    <text x="800" y="88" text-anchor="middle" class="title">Le simulateur de devis EBM</text>
    <text x="800" y="135" text-anchor="middle" class="subtitle">Une estimation structurée, expliquée simplement.</text>

    <g transform="translate(110 190)" filter="url(#shadow)">
      <rect width="1380" height="158" rx="30" fill="#ffffff"/>
      <text x="52" y="46" class="kicker">PRINCIPE</text>
      <text x="52" y="86" class="body">Comme une moyenne au lycée : chaque élément compte.</text>
      <text x="52" y="121" class="small">Les coefficients ajustent ensuite le résultat selon la réalité du projet.</text>
      <rect x="1016" y="39" width="300" height="82" rx="24" fill="url(#accent)"/>
      <text x="1166" y="73" text-anchor="middle" class="chip">Simple à lire</text>
      <text x="1166" y="102" text-anchor="middle" class="chip">sérieux à calculer</text>
    </g>

    <g transform="translate(110 390)">
      <text x="0" y="0" class="section">1. Les informations du projet</text>
      <text x="0" y="35" class="small">Le client répond à quelques questions claires.</text>

      <g transform="translate(0 72)" filter="url(#shadow)">
        <rect width="250" height="145" rx="26" fill="#f9739b"/>
        <text x="125" y="52" text-anchor="middle" class="white-title">Surface</text>
        <text x="125" y="88" text-anchor="middle" class="white-small">m² à bâtir</text>
        <text x="125" y="116" text-anchor="middle" class="white-small">ex. 200 m²</text>
      </g>
      <g transform="translate(282 72)" filter="url(#shadow)">
        <rect width="250" height="145" rx="26" fill="#7c3aed"/>
        <text x="125" y="52" text-anchor="middle" class="white-title">Style</text>
        <text x="125" y="88" text-anchor="middle" class="white-small">Économique</text>
        <text x="125" y="116" text-anchor="middle" class="white-small">Standing, Prestige</text>
      </g>
      <g transform="translate(564 72)" filter="url(#shadow)">
        <rect width="250" height="145" rx="26" fill="#0f9f83"/>
        <text x="125" y="52" text-anchor="middle" class="white-title">Terrain</text>
        <text x="125" y="88" text-anchor="middle" class="white-small">plat, pente légère</text>
        <text x="125" y="116" text-anchor="middle" class="white-small">ou pente forte</text>
      </g>
      <g transform="translate(846 72)" filter="url(#shadow)">
        <rect width="250" height="145" rx="26" fill="#e88b00"/>
        <text x="125" y="52" text-anchor="middle" class="white-title">Zone</text>
        <text x="125" y="88" text-anchor="middle" class="white-small">Tunis, côtes,</text>
        <text x="125" y="116" text-anchor="middle" class="white-small">intérieur, sud</text>
      </g>
      <g transform="translate(1128 72)" filter="url(#shadow)">
        <rect width="250" height="145" rx="26" fill="#ef4444"/>
        <text x="125" y="52" text-anchor="middle" class="white-title">Options</text>
        <text x="125" y="88" text-anchor="middle" class="white-small">piscine, garage,</text>
        <text x="125" y="116" text-anchor="middle" class="white-small">jardin</text>
      </g>
    </g>

    <g transform="translate(110 705)" filter="url(#shadow)">
      <rect width="660" height="235" rx="30" fill="#ffffff"/>
      <text x="46" y="55" class="section">2. Le calcul de base</text>
      <text x="46" y="102" class="body">Chaque poste de travaux est calculé :</text>
      <rect x="46" y="127" width="568" height="58" rx="20" fill="#fce7f3"/>
      <text x="330" y="164" text-anchor="middle" class="formula">quantité × prix unitaire</text>
      <text x="46" y="213" class="small">Exemples : fondations, maçonnerie, électricité, finitions.</text>
    </g>

    <g transform="translate(830 705)" filter="url(#shadow)">
      <rect width="660" height="235" rx="30" fill="#ffffff"/>
      <text x="46" y="55" class="section">3. Les coefficients</text>
      <text x="46" y="102" class="body">Le prix est ajusté selon le contexte :</text>
      <rect x="46" y="127" width="568" height="58" rx="20" fill="#ede9fe"/>
      <text x="330" y="164" text-anchor="middle" class="formula">style × étage × terrain × zone</text>
      <text x="46" y="213" class="small">Un projet plus complexe reçoit un ajustement plus élevé.</text>
    </g>

    <g transform="translate(220 985)" filter="url(#shadow)">
      <rect width="1160" height="132" rx="34" fill="#ffffff"/>
      <rect x="28" y="28" width="1104" height="50" rx="25" fill="url(#accent)"/>
      <text x="580" y="62" text-anchor="middle" class="chip">Budget estimé = total des postes + frais + marge + imprévus</text>
      <text x="580" y="106" text-anchor="middle" class="small">Le résultat aide le client à se situer. EBM vérifie ensuite le projet pour préparer un devis réel.</text>
    </g>
  </g>
</svg>
